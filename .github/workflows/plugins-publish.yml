# Publishes the plugin bundles to npm, where every backend (NAS and phone)
# picks them up within six hours (internal/pluginstore).
#
# A plugin ships when its version changes: bump "version" in
# apps/backend/plugins/<name>/package.json. Versions already on npm are skipped.
# The SDK (@letsmoe/otter-sdk, packages/otter-sdk) is published the same way.
#
# Authenticates with npm trusted publishing (OIDC), no token: every package
# needs this workflow (Letsmoe/otter, plugins-publish.yml) registered as its
# trusted publisher on npmjs.com. npm only allows that for packages that
# exist, so a new plugin's first version is published by hand.
name: Publish plugins

on:
  push:
    branches: [main]
    paths:
      - apps/backend/plugins/**
      - apps/backend/scripts/**
      - packages/otter-sdk/**
      - .github/workflows/plugins-publish.yml
  workflow_dispatch:

concurrency:
  group: plugins-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this run's OIDC token for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # No registry-url: with it, setup-node writes an .npmrc whose auth token (a placeholder
      # without an NPM_TOKEN secret) npm sends instead of trying trusted publishing, and the
      # registry answers 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      # Plugins only import the SDK at bundle time, same as the Dockerfile.
      - name: Link the plugin SDK
        run: |
          mkdir -p node_modules/@letsmoe
          ln -s ../../packages/otter-sdk node_modules/@letsmoe/otter-sdk

      - name: Bundle plugins
        working-directory: apps/backend
        run: bun scripts/bundle-plugins.ts --release --out "$RUNNER_TEMP/plugins"

      # Provenance is attached automatically with trusted publishing. One package that fails
      # (e.g. no trusted publisher registered yet) doesn't hold back the others; the step fails at the end.
      - name: Publish new versions
        run: |
          failed=""
          for folder in "$GITHUB_WORKSPACE/packages/otter-sdk/" "$RUNNER_TEMP"/plugins/*/; do
            name=$(jq -r .name "$folder/package.json")
            version=$(jq -r .version "$folder/package.json")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            echo "Publishing $name@$version"
            if ! (cd "$folder" && npm publish --access public); then
              echo "::error::Publishing $name@$version failed"
              failed="$failed $name@$version"
              # npm only says why trusted publishing was refused at verbose level.
              echo "::group::Trusted publishing log of $name"
              (cd "$folder" && npm publish --access public --loglevel verbose 2>&1 | grep -iE "oidc|trust|provenance" || true)
              echo "::endgroup::"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Not published:$failed"
            exit 1
          fi
