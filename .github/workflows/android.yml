# Builds the native Android app (backend binary + plugin bundles + APK) and
# keeps the APK as a workflow artifact. Publishing a GitHub release builds the
# APK from the release's tag and attaches it, which letsmoe.com/projects/otter links to.
name: Android

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - apps/android/**
      - apps/backend/**
      - packages/otter-sdk/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Plugins only import the SDK at bundle time, same as the Dockerfile.
      - name: Link the plugin SDK
        run: |
          mkdir -p node_modules/@letsmoe
          ln -s ../../packages/otter-sdk node_modules/@letsmoe/otter-sdk

      # One fixed signing key, so the in-app updater can install each release over the last.
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otter-release.jks"
          echo "OTTER_KEYSTORE_FILE=$RUNNER_TEMP/otter-release.jks" >> "$GITHUB_ENV"

      # Releases are versioned by their tag (v1.2.0 → 1.2.0); the updater compares against it.
      - name: Set the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "OTTER_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ -n "$TAG" ]; then
            echo "OTTER_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: apps/android
        env:
          # Optional: bakes in the built-in TMDB key; without it the app asks on first start.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OTTER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bun run apk

      - uses: actions/upload-artifact@v4
        with:
          name: otter-android-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp apps/android/app/build/outputs/apk/release/*.apk "otter-${TAG}.apk"
          gh release upload "$TAG" "otter-${TAG}.apk" --clobber
