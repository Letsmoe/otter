# Builds the native Android app (backend binary + plugin bundles + APK) and
# keeps the APK as a workflow artifact.
name: Android

on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - apps/backend/**
      - packages/otter-sdk/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Plugins only import the SDK at bundle time, same as the Dockerfile.
      - name: Link the plugin SDK
        run: |
          mkdir -p node_modules/@neoworks-dev
          ln -s ../../packages/otter-sdk node_modules/@neoworks-dev/otter-sdk

      - name: Build APK
        working-directory: apps/android
        env:
          # Optional: bakes in the built-in TMDB key; without it the app asks on first start.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bun run apk

      - uses: actions/upload-artifact@v4
        with:
          name: otter-android-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
