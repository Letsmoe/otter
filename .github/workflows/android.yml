# Builds the native Android app (backend binary + plugin bundles + APK) and
# keeps the APK as a workflow artifact. Publishing a GitHub release builds the
# release APK from the release's tag and attaches it, which letsmoe.com/projects/otter
# links to. Every other run builds a debug APK and puts it on the rolling "nightly"
# pre-release, the app's nightly update channel. APK names end in -build<run number>,
# so the app can tell which build is newer across both channels.
name: Android

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - apps/android/**
      - apps/backend/**
      - packages/otter-sdk/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Plugins only import the SDK at bundle time, same as the Dockerfile.
      - name: Link the plugin SDK
        run: |
          mkdir -p node_modules/@letsmoe
          ln -s ../../packages/otter-sdk node_modules/@letsmoe/otter-sdk

      # One fixed signing key, so the in-app updater can install each release over the last.
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otter-release.jks"
          echo "OTTER_KEYSTORE_FILE=$RUNNER_TEMP/otter-release.jks" >> "$GITHUB_ENV"

      # The versionCode comes from the release a build is based on (v1.2.3 → 10010203), so a
      # release and the debug builds after it share it and install over each other both ways;
      # Android only refuses a lower code. The 10000000 base stays above the run numbers that
      # were versionCodes up to v0.0.3. The run number goes in as the build number.
      # Releases are named by their tag (1.2.3), nightly builds by the latest release (1.2.3-nightly.61).
      - name: Set the version and build type
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
        run: |
          version_code() {
            IFS=. read -r major minor patch <<< "${1%%-*}"
            echo $((10000000 + 10#${major:-0} * 10000 + 10#${minor:-0} * 100 + 10#${patch:-0}))
          }
          echo "OTTER_BUILD_NUMBER=$RUN" >> "$GITHUB_ENV"
          if [ -n "$TAG" ]; then
            echo "OTTER_VERSION_CODE=$(version_code "${TAG#v}")" >> "$GITHUB_ENV"
            echo "OTTER_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            exit 0
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          echo "OTTER_VERSION_CODE=$(version_code "${latest#v}")" >> "$GITHUB_ENV"
          echo "OTTER_VERSION_NAME=${latest#v}-nightly.$RUN" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: apps/android
        env:
          # Optional: bakes in the built-in TMDB key; without it the app asks on first start.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OTTER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = release ]; then
            bun run apk
          else
            bun run apk:debug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: otter-android-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          retention-days: 30

      - name: Attach APK to the release
        if: env.BUILD_TYPE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
        run: |
          cp apps/android/app/build/outputs/apk/release/*.apk "otter-${TAG}-build${RUN}.apk"
          gh release upload "$TAG" "otter-${TAG}-build${RUN}.apk" --clobber

      # A pre-release never counts as "latest", so the release channel doesn't see it.
      - name: Publish the nightly build
        if: env.BUILD_TYPE == 'debug' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          apk="otter-nightly-build${RUN}.apk"
          cp apps/android/app/build/outputs/apk/debug/*.apk "$apk"
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --latest=false --title "Nightly build" --notes "Rebuilt on every push to main."
          fi
          gh release edit nightly --prerelease --title "Nightly build $RUN" \
            --notes "Nightly build $RUN from ${GITHUB_SHA::7}. Rebuilt on every push to main; can break."
          gh release upload nightly "$apk" --clobber
          for old in $(gh release view nightly --json assets --jq '.assets[].name'); do
            if [ "$old" != "$apk" ]; then
              gh release delete-asset nightly "$old" -y
            fi
          done
