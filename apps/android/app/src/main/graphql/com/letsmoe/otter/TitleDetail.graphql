query TitleDetail($id: ID!, $profileId: ID!) {
  title(id: $id) {
    id
    mediaType
    title
    tagline
    overview
    year
    runtime
    status
    voteAverage
    posterPath
    backdropPath
    trailerKey
    collectionId
    genres
    inWatchlist(profileId: $profileId)
    notifying(profileId: $profileId)
    rating(profileId: $profileId)
    progress(profileId: $profileId) {
      progressSeconds
      durationSeconds
      completed
    }
    ...TitleWatchState
    credits {
      person {
        id
        name
        profilePath
      }
      role
      job
      character
      order
    }
    seasons {
      id
      seasonNumber
      name
      episodeCount
    }
    related(limit: 20) {
      ...TitleCard
    }
  }
}

# Whether the profile finished the title, and whether a rewatch of it is going.
fragment TitleWatchState on Title {
  progress(profileId: $profileId) {
    completed
  }
  rewatch(profileId: $profileId) {
    finished
  }
}

query CurrentWatchState($id: ID!, $profileId: ID!) {
  title(id: $id) {
    id
    ...TitleWatchState
  }
}

fragment EpisodeRef on Episode {
  id
  seasonNumber
  episodeNumber
  name
}

query SeriesEpisodes($id: ID!, $profileId: ID!) {
  title(id: $id) {
    seasons {
      episodes {
        ...EpisodeRef
        overview
        airDate
        runtime
        stillPath
        voteAverage
        filler
        next {
          ...EpisodeRef
        }
        progress(profileId: $profileId) {
          progressSeconds
          durationSeconds
        }
      }
    }
  }
}
