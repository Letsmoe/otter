subscription Streams($id: ID!) {
  streams(id: $id) {
    done
    streams {
      ...StreamLink
    }
  }
}

fragment StreamLink on Stream {
  id
  plugin
  label
  quality
  language
  playable
  speedBps
  report {
    ...LinkReportFields
  }
}

fragment LinkReportFields on LinkReport {
  claimedHeight
  measuredHeight
  overclaimed
  bitrateBps
  stalls
  stallMillis
  firstFrameMillis
  plays
  roughPlays
}

mutation ReportLinkPlayback($input: LinkReportInput!) {
  reportLinkPlayback(input: $input)
}

mutation ResolveStream($streamId: ID!) {
  resolveStream(streamId: $streamId) {
    url
    mimeType
  }
}

mutation ResolveBestStream($streamIds: [ID!]!) {
  resolveBestStream(streamIds: $streamIds) {
    url
    mimeType
    streamId
  }
}
