fragment NotificationFields on Notification {
  id
  kind
  heading
  body
  createdAt
  read
  title {
    id
    title
    backdropPath
  }
  episode {
    id
    seasonNumber
    episodeNumber
    stillPath
  }
}

query Notifications($profileId: ID!, $limit: Int!) {
  notifications(profileId: $profileId, limit: $limit) {
    ...NotificationFields
  }
}

mutation MarkNotificationsRead($profileId: ID!) {
  markNotificationsRead(profileId: $profileId)
}

mutation CheckNotifications {
  checkNotifications
}

query ProfileLiked($profileId: ID!) {
  likedTitles(profileId: $profileId) {
    ...TitleCard
  }
}

query AppSettings {
  settings {
    tmdbApiKey
    tmdbLanguage
    requireVpn
    usesDefaultTmdbKey
    hasDefaultTmdbKey
  }
}

mutation UpdateAppSettings($input: SettingsInput!) {
  updateSettings(input: $input) {
    tmdbApiKey
    tmdbLanguage
    requireVpn
  }
}

fragment TmdbSetupFields on Settings {
  tmdbKeyStatus
  usesDefaultTmdbKey
  hasDefaultTmdbKey
  tmdbKeyPromptSeen
}

query TmdbSetup {
  settings {
    ...TmdbSetupFields
  }
}

mutation SaveTmdbSetup($input: SettingsInput!) {
  updateSettings(input: $input) {
    ...TmdbSetupFields
  }
}

mutation CheckTmdbConnection {
  checkTmdbConnection
}

query TmdbReachable {
  status {
    tmdbReachable
  }
}

query VpnStatus {
  status {
    vpnConnected
    requireVpn
  }
}

fragment PluginFields on Plugin {
  name
  displayName
  description
  icon
  version
  capabilities
  enabled
  available
  settings {
    key
    label
    description
    type
    required
    default
    value
  }
  account {
    signupUrl
    username
    loggedIn
    error
  }
}

mutation LoginPlugin($name: String!, $username: String!, $password: String!) {
  loginPlugin(name: $name, username: $username, password: $password) {
    ...PluginFields
  }
}

mutation LogoutPlugin($name: String!) {
  logoutPlugin(name: $name) {
    ...PluginFields
  }
}

query Plugins {
  plugins {
    ...PluginFields
  }
}

mutation SetPluginEnabled($name: String!, $enabled: Boolean!) {
  setPluginEnabled(name: $name, enabled: $enabled) {
    ...PluginFields
  }
}

mutation UpdatePlugins {
  updatePlugins {
    updated {
      name
      fromVersion
      toVersion
    }
    failed
  }
}

mutation SetPluginSettings($name: String!, $values: [PluginSettingInput!]!) {
  setPluginSettings(name: $name, values: $values) {
    ...PluginFields
  }
}
