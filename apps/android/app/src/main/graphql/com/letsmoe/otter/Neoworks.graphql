fragment NeoworksAccountFields on NeoworksAccount {
  signedIn
  email
  name
  lastSync {
    at
    received
    sent
    failure
  }
}

query NeoworksAccount {
  neoworksAccount {
    ...NeoworksAccountFields
  }
}

mutation StartNeoworksSignIn {
  startNeoworksSignIn
}

mutation CompleteNeoworksSignIn($code: String!, $state: String!) {
  completeNeoworksSignIn(code: $code, state: $state) {
    ...NeoworksAccountFields
  }
}

mutation SignOutOfNeoworks {
  signOutOfNeoworks {
    ...NeoworksAccountFields
  }
}

mutation SyncNeoworksSoon {
  syncNeoworksSoon
}

mutation SyncNeoworks {
  syncNeoworks {
    ...NeoworksAccountFields
  }
}
