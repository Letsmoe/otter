subscription Challenges {
  challenges {
    id
    kind
    url
    domain
    interactive
    click
    submit
  }
}

mutation CompleteChallenge($id: ID!, $cookies: String!, $userAgent: String!, $finalUrl: String) {
  completeChallenge(id: $id, cookies: $cookies, userAgent: $userAgent, finalUrl: $finalUrl)
}

mutation FailChallenge($id: ID!, $reason: String!, $linkGone: Boolean) {
  failChallenge(id: $id, reason: $reason, linkGone: $linkGone)
}
